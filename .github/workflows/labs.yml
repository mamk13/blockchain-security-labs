name: Educational labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Backing and replay
        working-directory: labs/01-backing-and-replay
        run: python -m unittest -v fee_guard_example test_replay
      - name: Upgrade intent
        working-directory: labs/02-upgrade-intent
        run: python -m unittest -v test_upgrade
      - name: Sandbox boundary
        working-directory: labs/03-sandbox-boundary
        run: python -m unittest -v test_sandbox
