name: Educational labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Backing and replay
        working-directory: labs/01-backing-and-replay
        run: python -m unittest -v fee_guard_example test_replay
      - name: Upgrade intent
        working-directory: labs/02-upgrade-intent
        run: python -m unittest -v test_upgrade
      - name: Sandbox boundary
        working-directory: labs/03-sandbox-boundary
        run: python -m unittest -v test_sandbox
      - name: Runtime version gate
        working-directory: labs/04-runtime-version-gate
        run: python -m unittest -v test_version_gate
      - name: Oracle age, skew and units
        working-directory: labs/05-oracle-age-skew-units
        run: python -m unittest -v test_oracle_guard
      - name: Share accounting and rounding
        working-directory: labs/06-share-accounting-rounding
        run: python -m unittest -v test_vault_rounding
      - name: Revocable authorization
        working-directory: labs/07-revocable-authorization
        run: python -m unittest -v test_authorization
      - name: Initialization boundary
        working-directory: labs/08-initialization-boundary
        run: python -m unittest -v test_initialization
      - name: Lab 09 - Authorization epochs
        working-directory: labs/09-authorization-epochs
        run: python -m unittest -v test_epochs
      - name: Lab 10 - Domain-separated permits
        working-directory: labs/10-domain-separated-permits
        run: python -m unittest -v test_domains
      - name: Lab 11 - Callback settlement ordering
        working-directory: labs/11-callback-settlement
        run: python -m unittest -v test_settlement
      - name: Lab 12 - Payment liveness and failure isolation
        working-directory: labs/12-payment-liveness
        run: python -m unittest -v test_payments
      - name: Lab 13 - Received-amount credit
        working-directory: labs/13-received-amount-credit
        run: python -m unittest -v test_deposits
      - name: Lab 14 - Merkle claim binding and root rotation
        working-directory: labs/14-merkle-claim-binding
        run: python -m unittest -v test_claims
      - name: Lab 15 - Transient frame lifetime
        working-directory: labs/15-transient-frame-lifetime
        run: python -m unittest -v test_transient
      - name: Lab 16 - Code and storage context
        working-directory: labs/16-code-storage-context
        run: python -m unittest -v test_context
      - name: Lab 17 - Packed layout compatibility
        working-directory: labs/17-packed-layout-compatibility
        run: python -m unittest -v test_layout
      - name: Lab 18 - Atomic upgrade migration
        working-directory: labs/18-atomic-upgrade-migration
        run: python -m unittest -v test_migration
